name: App Integration
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://security_test:security_test@localhost:5432/security_test
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test-access-key
  AWS_SECRET_ACCESS_KEY: test-secret-key
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3127
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: security-control
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: security_test
          POSTGRES_PASSWORD: security_test
          POSTGRES_DB: security_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U security_test -d security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@11.21.1
      - name: Install dependencies
        run: npm ci
      - name: Prepare the disposable catalog
        run: npm run test:db
      - name: Build the app
        run: npm run build
      - name: Install browsers
        run: npm exec -- playwright install --with-deps
      - name: Run app browser tests
        run: npm run test:e2e
